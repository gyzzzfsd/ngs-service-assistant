<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 禁用缓存：页面由 python -m http.server 提供，它不发 Cache-Control，
     浏览器会按启发式规则缓存，导致改了 HTML 却看不到效果（还以为是没改对） -->
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Pragma" content="no-cache">
<title>检测服务助手 · 在线服务</title>
<style>
  /* ============================================================
   * 视觉规范（微信风）
   *   底色 #ededed（微信聊天页灰）、自己气泡 #95ec69（微信绿）、
   *   对方气泡 #ffffff、品牌绿 #07c160（发送按钮/在线状态）。
   * 一个页面一个文件：顾客视图与坐席视图共用同一套聊天窗口骨架，
   * 只是坐席多一栏会话列表，数据源按角色切换。
   * ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --wx-bg: #ededed;
    --wx-mine: #95ec69;
    --wx-brand: #07c160;
    --wx-text: #191919;
    --wx-muted: #999999;
    --wx-line: #e7e7e7;
  }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #f2f2f2; color: var(--wx-text);
    height: 100vh; display: flex; flex-direction: column;
  }
  .app { flex: 1; min-height: 0; display: flex; gap: 14px; padding: 16px; }

  /* ---------- 聊天窗口（页面中央的那张"卡片"） ---------- */
  .chat-window {
    width: 100%; max-width: 900px; height: 100%; margin: 0 auto;
    background: var(--wx-bg); border-radius: 12px; overflow: hidden;
    box-shadow: 0 6px 26px rgba(0, 0, 0, 0.10);
    display: flex; flex-direction: column;
  }

  /* 顶部标题栏：左侧是"和谁在聊"，右侧常驻显示"当前登录用户"。
     固定在最上方不随消息滚动 —— 中途往上翻记录时也知道自己在哪个账号下。 */
  .chat-head {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 18px; background: #f7f7f7; border-bottom: 1px solid var(--wx-line);
  }
  .peer { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .peer-meta { min-width: 0; }
  .peer-name {
    font-size: 15px; font-weight: 600; color: var(--wx-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .peer-sub {
    font-size: 12px; color: var(--wx-muted); margin-top: 2px;
    /* 窄窗口下不加这句，副标题会被挤成一列竖排单字（flex 子项默认允许压缩到极窄） */
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .head-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  /* "我"标识：小头像 + 昵称 + 角色，微信里没有，这里是为了满足"一直看到登录用户" */
  .me-chip {
    display: flex; align-items: center; gap: 7px;
    background: #fff; border: 1px solid var(--wx-line); border-radius: 999px;
    padding: 4px 12px 4px 4px; font-size: 13px; color: #555;
  }
  .me-chip b { color: var(--wx-text); font-weight: 600; }
  .me-chip .role { font-size: 11px; color: var(--wx-brand); }
  .ws-dot { font-size: 12px; color: var(--wx-brand); }
  .ghost-btn {
    background: #fff; border: 1px solid var(--wx-line); border-radius: 6px;
    padding: 5px 12px; font-size: 12px; color: #666; cursor: pointer;
  }
  .ghost-btn:hover { border-color: #cfcfcf; color: var(--wx-text); }

  /* ---------- 头像（文字头像：显示完整称呼，颜色由名字哈希决定） ---------- */
  /* 宽度必须能随文字增长（min-width + padding），不能再写死 width。
     写死 36px 时"客服""张三"这种两个字会被挤成竖排单字，只剩一个字看得见。 */
  .avatar {
    min-width: 36px; height: 36px; padding: 0 6px; border-radius: 8px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 600; letter-spacing: 0;
    line-height: 1; white-space: nowrap;
    background: #9c88ff; user-select: none;
  }
  .avatar.lg { min-width: 38px; height: 38px; padding: 0 8px; font-size: 12.5px; }
  .avatar.sm { min-width: 22px; height: 22px; padding: 0 5px; font-size: 10px; border-radius: 5px; }

  /* ---------- 消息区 ---------- */
  .banner {
    display: none; flex-shrink: 0; margin: 10px 18px 0; padding: 8px 14px;
    border-radius: 6px; font-size: 12.5px; text-align: center;
    background: #fff8e6; color: #b88230; border: 1px solid #fbeccd;
  }
  .banner.human { background: #e8f8ec; color: #2f9e52; border-color: #cdeed8; }

  /* 消息区做成纵向 flex，并用 :first-child 的 auto 外边距把消息"压到底部"——
     微信里新会话是从底部往上排的，消息少的时候不会孤零零挂在顶部。
     内容超高时 auto 外边距自动归零，滚动依旧正常（不会把顶部内容顶出视野）。 */
  .msg-area { flex: 1; overflow-y: auto; padding: 18px 20px 8px; display: flex; flex-direction: column; }
  .msg-area > :first-child { margin-top: auto; }

  /* 消息行：头像 + 气泡。自己发的整行反向，头像自然落到右侧 */
  .row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 16px; }
  .row.mine { flex-direction: row-reverse; }

  /* 连续同一个人发言：只第一条显示头像，后面的收起并缩紧间距（微信的连发效果）。
     判据写在 JS 里：上一条同角色、同方向，并且没有跨过时间分隔条。 */
  .row.cont { margin-top: -8px; }
  .row.cont .avatar { visibility: hidden; }
  .row.cont .who { display: none; }

  /* max-width 必须挂在"气泡外层容器"(.msg-wrap)上，绝不能挂在 .bubble 自己身上。
     .bubble 的父级是 auto 宽度的 flex item，若气泡写 max-width: 68%，
     就形成"父宽由子撑、子宽受父限"的循环：浏览器先按内容算出父宽（短句只有几十 px），
     再取它的 68% 当气泡上限 —— "你好"这种短句会被压成一列单字。
     挂在 .msg-wrap 后，百分比对着的是 .row 的确定宽度，循环消失。 */
  .msg-wrap { max-width: 68%; min-width: 0; }
  .row.mine .msg-wrap { display: flex; flex-direction: column; align-items: flex-end; }

  .who { font-size: 11.5px; color: var(--wx-muted); margin: 0 2px 5px; }
  .row.mine .who { text-align: right; }

  .bubble {
    position: relative; padding: 10px 13px; border-radius: 6px;
    font-size: 14px; line-height: 1.65; word-break: break-word; white-space: pre-wrap;
    background: #fff; color: var(--wx-text);
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.04);
  }
  /* 气泡小尖角：微信的标志性细节，用两个透明边框拼出来，不占布局宽度 */
  .bubble::before {
    content: ''; position: absolute; top: 11px; width: 0; height: 0;
    border: 6px solid transparent;
  }
  .row:not(.mine) .bubble::before { left: -11px; border-right-color: #fff; }
  .row.mine .bubble::before { right: -11px; border-left-color: var(--wx-mine); }

  .row.mine .bubble { background: var(--wx-mine); }

  /* 时间分隔条：微信里就是一行居中灰字（不加底色块，加了反而看不清） */
  .time-sep { text-align: center; margin: 6px 0 16px; }
  .time-sep span { display: inline-block; color: #adadad; font-size: 11.5px; }

  /* 气泡里挂的按钮（确认加急/复检/退单 / 转技术支持） */
  .actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .actions button {
    border: none; border-radius: 5px; padding: 7px 14px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  .btn-confirm { background: #fa5151; color: #fff; }
  .btn-confirm:disabled { background: #fbb6b6; cursor: not-allowed; }
  .btn-handoff { background: var(--wx-brand); color: #fff; }
  .btn-plain { background: rgba(0, 0, 0, 0.06); color: #666; }

  /* ---------- 输入区 ---------- */
  .input-bar {
    flex-shrink: 0; display: flex; align-items: flex-end; gap: 10px;
    padding: 12px 18px 16px; background: #f7f7f7; border-top: 1px solid var(--wx-line);
  }
  .input-bar textarea {
    flex: 1; resize: none; height: 44px; padding: 11px 13px; font-family: inherit;
    font-size: 14px; line-height: 1.4; color: var(--wx-text); background: #fff;
    border: 1px solid var(--wx-line); border-radius: 8px; outline: none;
  }
  .input-bar textarea:focus { border-color: #c9c9c9; }
  .input-bar textarea:disabled { background: #f0f0f0; color: #aaa; }
  .input-bar .send {
    width: 88px; height: 40px; border: none; border-radius: 6px; cursor: pointer;
    background: var(--wx-brand); color: #fff; font-size: 14px; font-family: inherit;
  }
  .input-bar .send:hover { background: #06ad56; }
  .input-bar .send:disabled { background: #a8e3bf; cursor: not-allowed; }

  /* ---------- 坐席视图：左侧会话列表 + 右侧聊天窗口 ---------- */
  /* 坐席页要占满整宽：顾客页是单张居中卡片（限宽 900），坐席页右栏则要跟着窗口长 */
  #agent-view { width: 100%; gap: 14px; }
  #agent-view .chat-window { max-width: none; flex: 1; min-width: 0; }
  .side-panel {
    width: 300px; flex-shrink: 0; background: #fff; border-radius: 12px;
    overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 6px 26px rgba(0, 0, 0, 0.10);
  }
  .side-head {
    flex-shrink: 0; display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; background: #f7f7f7; border-bottom: 1px solid var(--wx-line);
  }
  /* 左栏拆成"接待中"和"待接管"两段，各自独立滚动。
     min-height: 0 是嵌套 flex 能滚起来的前提，缺了它子列表会把父容器顶高。 */
  .side-section { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  .side-section + .side-section { border-top: 1px solid #f0f0f0; }
  .side-section h2 {
    flex-shrink: 0; font-size: 12.5px; font-weight: 600; color: var(--wx-muted);
    padding: 12px 16px 8px;
  }
  .queue-list { flex: 1; overflow-y: auto; }
  .queue-item {
    display: flex; gap: 10px; padding: 10px 14px; cursor: pointer;
    border-bottom: 1px solid #f7f7f7;
  }
  .queue-item:hover { background: #f5f5f5; }
  .queue-item.active { background: #e9e9e9; }
  .queue-item .info { min-width: 0; flex: 1; }
  .queue-item .name {
    font-size: 14px; color: var(--wx-text); font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .queue-item .preview {
    font-size: 12px; color: var(--wx-muted); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .queue-item .tag { font-size: 11px; color: var(--wx-brand); margin-left: 4px; }
  .queue-item button {
    align-self: center; background: var(--wx-brand); color: #fff; border: none;
    border-radius: 5px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .queue-empty { padding: 26px 16px; text-align: center; color: #c0c0c0; font-size: 12.5px; }

  .conv-panel { flex: 1; min-width: 0; }
  .conv-panel .head-ops { display: flex; gap: 8px; }
  .conv-none {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #b9b9b9; font-size: 13px;
  }

  /* ---------- 提示条 ---------- */
  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    padding: 10px 22px; border-radius: 8px; font-size: 13px; color: #fff;
    background: rgba(0, 0, 0, 0.76); opacity: 0; transition: opacity 0.3s;
    pointer-events: none; z-index: 99;
  }
  .toast.ok { background: rgba(7, 193, 96, 0.94); opacity: 1; }
  .toast.err { background: rgba(250, 81, 81, 0.94); opacity: 1; }

  /* 细滚动条，避免默认粗条破坏"卡片"观感 */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.14); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.24); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div class="app">

  <!-- 顾客视图 -->
  <div id="customer-view" style="display:none; width:100%;">
    <div class="chat-window">
      <!-- 顶部栏：左=聊天对象，右=常驻的登录用户 -->
      <div class="chat-head">
        <div class="peer">
          <div class="avatar lg" id="peer-avatar" style="background:#07c160">助手</div>
          <div class="peer-meta">
            <div class="peer-name" id="peer-name">检测服务助手</div>
            <div class="peer-sub" id="peer-sub">AI 助手在线：样本进度 · 检测产品 · 报告查询</div>
          </div>
        </div>
        <div class="head-right">
          <span class="me-chip" id="me-chip"></span>
          <span class="ws-dot" title="实时通道状态">●</span>
          <button class="ghost-btn" onclick="logout()">退出</button>
        </div>
      </div>

      <div id="banner" class="banner"></div>
      <div id="messages" class="msg-area"></div>

      <div class="input-bar">
        <textarea id="input" placeholder="输入您的问题，回车发送（Shift+回车换行）"></textarea>
        <button class="send" id="send-btn" onclick="sendMessage()">发 送</button>
      </div>
    </div>
  </div>

  <!-- 坐席视图 -->
  <div id="agent-view" class="agent-wrap" style="display:none">
    <aside class="side-panel">
      <!-- 左栏顶部同样常驻显示登录坐席 -->
      <div class="side-head">
        <div class="avatar lg" id="side-avatar">支持</div>
        <div class="peer-meta">
          <div class="peer-name" id="side-name">技术支持</div>
          <div class="peer-sub">技术支持工作台</div>
        </div>
      </div>

      <!-- 接待中：已接管（HUMAN）的会话。点一下就能回到那个用户的对话继续回复 -->
      <div class="side-section">
        <h2>接待中 <span id="active-count" style="color:#07c160"></span></h2>
        <div id="active-list" class="queue-list"><div class="queue-empty">暂无接待中的会话</div></div>
      </div>
      <div class="side-section">
        <h2>待接管 <span id="queue-count" style="color:#e6a23c"></span></h2>
        <div id="queue-list" class="queue-list"><div class="queue-empty">暂无排队用户</div></div>
      </div>
    </aside>

    <div class="chat-window conv-panel">
      <div class="chat-head">
        <div class="peer">
          <div class="avatar lg" id="conv-avatar" style="background:#9c88ff">客户</div>
          <div class="peer-meta">
            <div class="peer-name" id="conv-title">未选择会话</div>
            <div class="peer-sub" id="conv-sub">从左侧列表选一个会话开始接待</div>
          </div>
        </div>
        <div class="head-right">
          <span class="me-chip" id="agent-me-chip"></span>
          <span class="ws-dot" title="实时通道状态">●</span>
          <span class="head-ops" id="conv-head" style="display:none">
            <button class="ghost-btn" onclick="closeConv('ai')">结束并转回 AI</button>
            <button class="ghost-btn" onclick="closeConv('closed')">结束并关闭</button>
          </span>
          <button class="ghost-btn" onclick="logout()">退出</button>
        </div>
      </div>

      <div id="conv-body" class="msg-area">
        <div class="conv-none">← 点击左侧会话开始接待</div>
      </div>

      <div class="input-bar" id="agent-input" style="display:none">
        <textarea id="agent-input-box" placeholder="以技术支持工程师身份回复…"></textarea>
        <button class="send" onclick="agentReply()">回 复</button>
      </div>
    </div>
  </div>

</div>

<div id="toast" class="toast"></div>

<script>
/* ============================================================
 * 基础：地址、登录态、请求封装
 * ============================================================ */
const API = location.protocol + '//' + location.hostname + ':8010';
const token = localStorage.getItem('token');
const user = JSON.parse(localStorage.getItem('user') || 'null');

if (!token || !user) { location.href = 'login.html'; }

const MY_NAME = user.nickname || user.username;
const MY_ROLE = user.role === 'agent' ? '技术支持' : '送检客户';

/** 顶部"我"标识：小头像 + 昵称 + 角色，两个视图共用 */
function renderMeChip(el) {
  if (!el) return;
  el.innerHTML = `<span class="avatar sm" style="${avatarStyle(MY_NAME)}">${esc(avatarLabel(MY_NAME))}</span>
                  <span class="role">${MY_ROLE}</span>`;
}

function logout() { localStorage.clear(); location.href = 'login.html'; }

/** 统一请求：带 token；401 自动踢回登录页 */
async function api(path, options = {}) {
  const resp = await fetch(API + path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token,
      ...(options.headers || {}),
    },
  });
  if (resp.status === 401) { logout(); throw new Error('登录已过期'); }
  return resp;
}

function toast(text, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.className = 'toast ' + (ok ? 'ok' : 'err');
  setTimeout(() => { el.className = 'toast'; }, 2600);
}

function esc(s) {  // 防注入：用户与 AI 的内容一律转义后再进 innerHTML
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

/* ============================================================
 * 头像：用完整称呼生成文字头像（不引入图片资源，避免额外请求/加载失败）
 * ============================================================ */
const AVATAR_COLORS = ['#07c160', '#4c8bf5', '#f0a020', '#9c88ff', '#fa5151', '#00b8d9', '#8d6e63'];

/**
 * 头像文字：显示完整称呼，不再只取首字。
 * 超过 4 个字才截断（"张"→"张三"、"客"→"客服"），否则头像是块会宽得离谱。
 */
function avatarLabel(name) {
  const s = (name || '').trim();
  if (!s) return '?';
  return s.length > 4 ? s.slice(0, 3) + '…' : s;
}

/** 同一个名字永远得到同一个颜色：按字符码累加取模，不依赖随机数 */
function avatarStyle(name) {
  let sum = 0;
  for (const ch of (name || '')) sum += ch.charCodeAt(0);
  return 'background:' + AVATAR_COLORS[sum % AVATAR_COLORS.length];
}

/* ============================================================
 * 气泡渲染（两个视图共用）
 * ============================================================ */
const ROLE_META = {
  // "谁是我"取决于观看视角——客户看 user 是自己，技术支持看 human 是自己，姓名标签随之切换
  user:  { cls: 'user',  who: user.role === 'agent' ? '送检客户' : '我' },
  ai:    { cls: 'ai',    who: 'AI 助手' },
  human: { cls: 'human', who: user.role === 'agent' ? '我' : '技术支持' },
};

/* 三个写操作的按钮映射：code → 按钮文案 / 确认端点 / 成功提示。
   与后端 schemas.ALLOWED_ACTION_CODES、api_actions.py 的三个路由一一对应。 */
const ACTION_META = {
  APPLY_URGENT: { label: '确认申请加急', endpoint: 'urgent', done: '✓ 已加急' },
  APPLY_RETEST: { label: '确认申请复检', endpoint: 'retest', done: '✓ 复检已登记' },
  APPLY_CANCEL: { label: '确认退单',     endpoint: 'cancel', done: '✓ 已退单' },
};

/** 时间分隔条：微信里两条消息隔得久了会插一条居中时间 */
function timeLabel(ts) {
  const d = new Date(ts);
  const now = new Date();
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return hm;
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  if (d.toDateString() === yest.toDateString()) return '昨天 ' + hm;
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
}

/**
 * 必要时插入时间分隔条（同一个容器内两条消息间隔超过 5 分钟才插）。
 * 时间戳挂在容器的自定义属性上，不额外维护全局状态。
 */
function maybeTimeSep(container, ts) {
  const last = container._lastTs || 0;
  if (!last || ts - last > 5 * 60 * 1000) {
    const sep = document.createElement('div');
    sep.className = 'time-sep';
    sep.innerHTML = `<span>${timeLabel(ts)}</span>`;
    container.appendChild(sep);
  }
  container._lastTs = ts;
}

/**
 * 渲染一条消息：头像 + 气泡（+ 可选按钮），并维护时间分隔条。
 * @param container 消息容器 DOM
 * @param m {id, role, content, created_at}
 * @param action {code, order_id} 可选：AI 建议的页面动作
 * @param replyType 可选：ANSWER / DECLINE / REQUEST_HANDOFF / ACTION_GUIDE
 */
function renderMessage(container, m, action = null, replyType = '') {
  const meta = ROLE_META[m.role] || { cls: 'ai', who: m.role };
  // 右侧 = 观看者自己的消息：顾客看自己发的 user 消息，坐席看自己发的 human 消息
  const mine = (user.role !== 'agent' && m.role === 'user')
            || (user.role === 'agent' && m.role === 'human');

  // 本地乐观渲染的消息没有 created_at，用当前时间兜底，时间条才连贯
  const ts = m.created_at ? new Date(m.created_at).getTime() : Date.now();
  maybeTimeSep(container, ts);

  const row = document.createElement('div');
  row.className = 'row ' + meta.cls + (mine ? ' mine' : '');
  row.dataset.msgId = m.id;
  row.dataset.role = m.role;
  row.dataset.mine = String(mine);

  // 连发判断：上一条是同一角色、同一侧、且中间没插时间条 → 这条算"续接"，收掉头像
  const prev = container.lastElementChild;
  if (prev && prev.classList.contains('row')
      && prev.dataset.role === m.role && prev.dataset.mine === String(mine)) {
    row.classList.add('cont');
  }

  let buttons = '';
  // 只有客户侧渲染 AI 建议的按钮；技术支持侧只读。
  // 三个写操作共用一套四段式（AI 出建议 → harness 校验 → 本按钮 → 后端条件 UPDATE），
  // 前端只是把动作码映射成按钮文案与确认端点。
  if (user.role !== 'agent') {
    if (action && ACTION_META[action.code]) {
      const meta = ACTION_META[action.code];
      buttons += `<div class="actions"><button class="btn-confirm" onclick="confirmAction('${action.code}', ${action.order_id}, this)">${meta.label} · 委托单 ${action.order_id}</button></div>`;
    }
    if (replyType === 'REQUEST_HANDOFF') {
      buttons += `<div class="actions"><button class="btn-handoff" onclick="requestHandoff()">转接技术支持</button></div>`;
    }
  }

  // 头像文字：自己用完整昵称，对方按角色显示（助手 / 技术支持 / 客户）
  const avatarText = mine ? avatarLabel(MY_NAME) : (m.role === 'ai' ? '助手' : (m.role === 'human' ? '支持' : '客户'));
  const avatarName = mine ? MY_NAME : (m.role === 'ai' ? 'AI助手' : (m.role === 'human' ? '技术支持' : '客户'));
  // 自己发的消息不显示名字（微信就这么做），对方的保留，用来区分 AI 与真人
  const who = mine ? '' : `<div class="who">${meta.who}</div>`;

  row.innerHTML = `
    <div class="avatar" style="${avatarStyle(avatarName)}">${esc(avatarText)}</div>
    <div class="msg-wrap">${who}<div class="bubble">${esc(m.content)}${buttons}</div></div>`;
  container.appendChild(row);
  container.scrollTop = container.scrollHeight;  // 新消息滚到底
}

/* ============================================================
 * WebSocket：实时推送 + 断线自动降级为轮询
 * ============================================================ */
let ws = null;
let pollTimer = null;   // WS 断开后的轮询兜底
let wsOk = false;

function setWsState(ok) {
  wsOk = ok;
  document.querySelectorAll('.ws-dot').forEach(el => {
    el.textContent = ok ? '●' : '○';
    el.style.color = ok ? '#07c160' : '#e6a23c';
    el.title = ok ? '实时通道已连接' : '实时通道断开（已启用轮询兜底）';
  });
}

function connectWs() {
  ws = new WebSocket('ws://' + location.hostname + ':8010/ws?token=' + encodeURIComponent(token));

  ws.onopen = () => { setWsState(true); stopPolling(); };
  ws.onmessage = (ev) => {
    const data = JSON.parse(ev.data);
    handlePush(data);
  };
  ws.onclose = () => {
    // 断线降级：3 秒后重连；重连成功前用轮询兜底（消息本体在库里，拉历史即可补齐）
    setWsState(false);
    startPolling();
    setTimeout(connectWs, 3000);
  };
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    if (user.role === 'agent') { loadPanels(); }
    else if (conversationId) { await syncMessages(); }
  }, 3000);
}
function stopPolling() { clearInterval(pollTimer); pollTimer = null; }

/** 服务端推送统一入口 */
function handlePush(data) {
  if (data.type === 'message') {
    // 坐席视图：投递到当前打开的会话；顾客视图：只处理自己会话的
    const target = user.role === 'agent' ? agentConvId : conversationId;
    if (data.conversation_id !== target) {
      if (user.role === 'agent') loadPanels();  // 别的会话有动静，刷新左栏角标与预览
      return;
    }
    if (data.message.role === 'user' && user.role !== 'agent') return;  // 自己的消息已本地渲染
    renderMessage(getMsgContainer(), data.message);
  } else if (data.type === 'status') {
    if (user.role !== 'agent' && data.conversation_id === conversationId) {
      applyStatus(data.status);
    }
  } else if (data.type === 'queue_update') {
    if (user.role === 'agent') loadPanels();
  }
}

function getMsgContainer() {
  return user.role === 'agent'
    ? document.getElementById('conv-body')
    : document.getElementById('messages');
}

/* ============================================================
 * 顾客视图逻辑
 * ============================================================ */
let conversationId = null;
let conversationStatus = 'AI';
let lastMsgId = 0;       // 轮询增量的游标
let sending = false;     // 发送中禁用按钮，防双击重复发送

async function initCustomer() {
  document.getElementById('customer-view').style.display = 'flex';
  renderMeChip(document.getElementById('me-chip'));

  // 进入客服页：有 AI 会话就复用（多轮上下文连续），没有就新建
  const resp = await api('/api/conversations', { method: 'POST' });
  const conv = await resp.json();
  conversationId = conv.id;
  conversationStatus = conv.status;
  applyStatus(conv.status);

  await syncMessages(true);
}

/** 拉全量历史（首次）或增量（轮询）： WS 断线时的消息兜底也走这里 */
async function syncMessages(first = false) {
  const resp = await api(`/api/conversations/${conversationId}/messages`);
  const msgs = await resp.json();
  const box = document.getElementById('messages');
  if (first) {
    box.innerHTML = '';
    lastMsgId = 0;
    box._lastTs = 0;   // 重拉历史时时间条一起重算，否则首条前后时间可能错位
  }
  for (const m of msgs) {
    if (m.id > lastMsgId) {
      renderMessage(box, m);
      lastMsgId = m.id;
    }
  }
}

/** 会话状态横幅 + 顶部状态文案 + 输入框文案随状态切换 */
function applyStatus(s) {
  conversationStatus = s;
  const banner = document.getElementById('banner');
  const input = document.getElementById('input');
  const sub = document.getElementById('peer-sub');
  const peerAvatar = document.getElementById('peer-avatar');
  const peerName = document.getElementById('peer-name');

  if (s === 'QUEUED') {
    banner.className = 'banner'; banner.style.display = 'block';
    banner.textContent = '正在为您转接技术支持工程师，请稍候…';
    input.placeholder = '您可以在等待期间继续留言，工程师接入后可以看到';
    sub.textContent = '正在转接技术支持…';
    peerName.textContent = '技术支持（排队中）';
    peerAvatar.textContent = '支持';
    peerAvatar.style.background = '#f0a020';
  } else if (s === 'HUMAN') {
    banner.className = 'banner human'; banner.style.display = 'block';
    banner.textContent = '技术支持工程师正在为您服务';
    input.placeholder = '直接输入，工程师会实时回复';
    sub.textContent = '技术支持在线';
    peerName.textContent = '技术支持';
    peerAvatar.textContent = '支持';
    peerAvatar.style.background = '#f0a020';
  } else if (s === 'CLOSED') {
    banner.className = 'banner'; banner.style.display = 'block';
    banner.textContent = '本次服务已结束';
    input.disabled = true;
    sub.textContent = '会话已结束';
  } else {  // AI
    banner.style.display = 'none';
    input.placeholder = '输入您的问题，回车发送（Shift+回车换行）';
    sub.textContent = 'AI 助手在线：样本进度 · 检测产品 · 报告查询';
    peerName.textContent = '检测服务助手';
    peerAvatar.textContent = '助手';
    peerAvatar.style.background = '#07c160';
  }
}

async function sendMessage() {
  if (sending) return;
  const box = document.getElementById('input');
  const content = box.value.trim();
  if (!content) return;

  sending = true;
  document.getElementById('send-btn').disabled = true;
  box.value = '';

  // 先本地渲染自己的消息（即时反馈，不等网络）
  renderMessage(document.getElementById('messages'), { role: 'user', content, id: 0 });
  // 游标等服务器响应回来后按真实 id 对齐（见下方两个分支），防止轮询时重复渲染

  try {
    const resp = await api(`/api/conversations/${conversationId}/messages`, {
      method: 'POST', body: JSON.stringify({ content }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || '发送失败');

    if (data.reply) {
      // AI 模式：渲染结构化回复（带按钮）
      lastMsgId = data.ai_message_id;
      renderMessage(
        document.getElementById('messages'),
        { id: data.ai_message_id, role: 'ai', content: data.reply.content },
        data.reply.action, data.reply.reply_type,
      );
    } else {
      // 人工模式：只有确认（user_message_id），回复由 WS/轮询送达
      lastMsgId = Math.max(lastMsgId, data.user_message_id);
    }
  } catch (e) {
    toast(e.message, false);
    box.value = content;  // 失败把内容还给输入框
  } finally {
    sending = false;
    document.getElementById('send-btn').disabled = false;
  }
}

/** 点【确认加急/复检/退单】：四段式的最后一段，后端三重条件原子复核。
 *  三个操作共用一个函数 —— 前端流程完全同构，差异只有端点与文案（见 ACTION_META）。 */
async function confirmAction(code, orderId, btn) {
  const meta = ACTION_META[code];
  btn.disabled = true;
  btn.textContent = '办理中…';
  try {
    const resp = await api(`/api/orders/${orderId}/${meta.endpoint}`, {
      method: 'POST',
      body: JSON.stringify({ conversation_id: conversationId }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || '操作失败');

    if (data.success) {
      btn.textContent = meta.done;
      toast(data.message, true);
    } else {
      btn.textContent = '无法办理';
      toast(data.message, false);
    }
    // 兜底同步一次：确认消息是后端写进会话的，WS 不在线也能看到
    await syncMessages();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = meta.label + ' · 委托单 ' + orderId;
    toast(e.message, false);
  }
}

/** 点【转接技术支持】 */
async function requestHandoff() {
  try {
    const resp = await api(`/api/conversations/${conversationId}/handoff`, { method: 'POST' });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail);
    applyStatus(data.status);  // QUEUED 或 HUMAN（坐席已在线时可能直接被接）
    toast('已发起转接', true);
  } catch (e) { toast(e.message, false); }
}

/* ============================================================
 * 坐席视图逻辑
 * ============================================================ */
let agentConvId = null;
const convNicknames = {};   // 会话 id → 顾客昵称（左栏渲染时顺手记下，供右侧标题用）

async function initAgent() {
  document.getElementById('agent-view').style.display = 'flex';
  renderMeChip(document.getElementById('agent-me-chip'));
  document.getElementById('side-name').textContent = MY_NAME;
  const sideAvatar = document.getElementById('side-avatar');
  sideAvatar.textContent = avatarLabel(MY_NAME);
  sideAvatar.style.cssText = avatarStyle(MY_NAME);
  await loadPanels();
}

/**
 * 刷新左栏两份列表：接待中（HUMAN）+ 待接管（QUEUED）。
 *
 * # 为什么是两份而不是一份：
 * 会话被接管后会离开 QUEUED 队列，只剩一份列表的话它就彻底消失了 ——
 * 坐席切去接待别人再想回来就没有入口，用户那边只能一直等。
 */
async function loadPanels() {
  // 并行发两个请求：串行等待会让左栏明显晚一拍才刷出来
  const [activeResp, queueResp] = await Promise.all([
    api('/api/agent/active'),
    api('/api/agent/queued'),
  ]);
  if (activeResp.ok) renderActive(await activeResp.json());
  if (queueResp.ok) renderQueue(await queueResp.json());
}

/** 渲染"接待中"：整行可点击，点一下切到该会话继续回复 */
function renderActive(items) {
  const list = document.getElementById('active-list');
  document.getElementById('active-count').textContent = items.length ? `(${items.length})` : '';

  if (!items.length) {
    list.innerHTML = '<div class="queue-empty">暂无接待中的会话</div>';
    return;
  }
  items.forEach(i => { convNicknames[i.conversation_id] = i.user_nickname; });
  list.innerHTML = items.map(i => `
    <div class="queue-item ${i.conversation_id === agentConvId ? 'active' : ''}"
         onclick="openActive(${i.conversation_id})">
      <div class="avatar" style="${avatarStyle(i.user_nickname)}">${esc(avatarLabel(i.user_nickname))}</div>
      <div class="info">
        <div class="name">${esc(i.user_nickname)} · 会话 ${i.conversation_id}</div>
        <div class="preview">${esc(i.last_message || '（暂无消息）')}</div>
      </div>
    </div>`).join('');
}

/** 渲染"待接管"：带接管按钮 */
function renderQueue(items) {
  const list = document.getElementById('queue-list');
  document.getElementById('queue-count').textContent = items.length ? `(${items.length})` : '';

  if (!items.length) {
    list.innerHTML = '<div class="queue-empty">暂无排队用户</div>';
    return;
  }
  items.forEach(i => { convNicknames[i.conversation_id] = i.user_nickname; });
  list.innerHTML = items.map(i => `
    <div class="queue-item ${i.conversation_id === agentConvId ? 'active' : ''}">
      <div class="avatar" style="${avatarStyle(i.user_nickname)}">${esc(avatarLabel(i.user_nickname))}</div>
      <div class="info">
        <div class="name">${esc(i.user_nickname)} · 会话 ${i.conversation_id}</div>
        <div class="preview">${esc(i.last_message || '（暂无消息）')}</div>
      </div>
      <button onclick="acceptConv(${i.conversation_id})">接 管</button>
    </div>`).join('');
}

/** 点"接待中"里的会话：只是切过去看，已经接管过，无需再 accept */
async function openActive(convId) {
  if (convId === agentConvId) return;  // 正在看这个会话，不必重复拉取
  await openConversation(convId);
}

async function acceptConv(convId) {
  try {
    const resp = await api(`/api/agent/conversations/${convId}/accept`, { method: 'POST' });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || '接管失败');
    await openConversation(convId);  // 内部会刷新左栏，该会话从"待接管"移到"接待中"
  } catch (e) { toast(e.message, false); }
}

async function openConversation(convId) {
  // 先记住当前会话：左栏高亮和 WS 消息投递都按它判断，晚一步就会投错窗口
  agentConvId = convId;

  document.getElementById('conv-head').style.display = 'flex';
  document.getElementById('agent-input').style.display = 'flex';

  const body = document.getElementById('conv-body');
  body.innerHTML = '<div class="conv-none">加载中…</div>';

  const resp = await api(`/api/conversations/${convId}/messages`);
  if (!resp.ok) {
    body.innerHTML = '<div class="conv-none">会话加载失败，请刷新页面重试</div>';
    return;
  }
  const msgs = await resp.json();

  const nickname = convNicknames[convId] || '客户';
  body.innerHTML = '';
  body._lastTs = 0;                      // 换会话必须重置时间游标，否则沿用上一会话的时间条基准
  document.getElementById('conv-title').textContent = nickname;
  document.getElementById('conv-sub').textContent = `会话 ${convId} · 技术支持服务中`;
  const av = document.getElementById('conv-avatar');
  av.textContent = avatarLabel(nickname);
  av.style.cssText = avatarStyle(nickname);

  for (const m of msgs) renderMessage(body, m);   // 坐席端不渲染按钮，纯只读视图

  await loadPanels();  // 高亮当前会话，同时把列表中已变化的归属/预览同步过来
}

async function agentReply() {
  const box = document.getElementById('agent-input-box');
  const content = box.value.trim();
  if (!content || !agentConvId) return;
  box.value = '';

  renderMessage(document.getElementById('conv-body'), { role: 'human', content, id: 0 });
  try {
    const resp = await api(`/api/agent/conversations/${agentConvId}/messages`, {
      method: 'POST', body: JSON.stringify({ content }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || '发送失败');
    await loadPanels();  // 预览与活跃时间要跟着更新，否则左栏显示的还是旧消息
  } catch (e) { toast(e.message, false); }
}

async function closeConv(back) {
  if (!agentConvId) return;
  try {
    const resp = await api(`/api/agent/conversations/${agentConvId}/close`, {
      method: 'POST', body: JSON.stringify({ back }),
    });
    if (!resp.ok) throw new Error((await resp.json()).detail);
    toast(back === 'ai' ? '已结束，会话转回 AI 接待' : '会话已关闭', true);
    agentConvId = null;
    document.getElementById('conv-head').style.display = 'none';
    document.getElementById('agent-input').style.display = 'none';
    document.getElementById('conv-title').textContent = '未选择会话';
    document.getElementById('conv-sub').textContent = '从左侧列表选一个会话开始接待';
    const body = document.getElementById('conv-body');
    body.innerHTML = '<div class="conv-none">← 点击左侧会话开始接待</div>';
    await loadPanels();  // 从"接待中"移除
  } catch (e) { toast(e.message, false); }
}

/* ============================================================
 * 入口
 * ============================================================ */
if (user.role === 'agent') {
  initAgent();
} else {
  initCustomer();
  document.getElementById('input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
}
document.getElementById('agent-input-box').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); agentReply(); }
});
connectWs();
</script>
